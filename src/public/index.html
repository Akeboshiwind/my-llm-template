<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLACEHOLDER</title>
  <!-- Tailwind CSS from CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX and ES modules -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="root" class="container mx-auto p-4">
    <!-- Initial content while JS loads -->
    <div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-md text-center">
      <h1 class="text-2xl font-bold mb-4">Loading PLACEHOLDER...</h1>
      <p class="text-gray-600">Please wait while the application initializes.</p>
    </div>
  </div>

  <!-- Load React component scripts in order -->
  <script type="text/babel" src="/js/components/Home.js"></script>
  <script type="text/babel" src="/js/components/Products.js"></script>
  <script type="text/babel" src="/js/components/NotFound.js"></script>
  
  <!-- Load the main app script -->
  <script type="text/babel" src="/js/app.js"></script>
  
  <!-- Initialize the app after all scripts are loaded -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Ensure all scripts have been loaded and processed
      setTimeout(() => {
        console.log("All components loaded, rendering app");
        if (typeof window.renderApp === 'function') {
          window.renderApp();
        } else {
          console.error("renderApp function not found");
        }
      }, 100); // Small delay to ensure Babel processing is complete
    });
  </script>
</body>
</html>
